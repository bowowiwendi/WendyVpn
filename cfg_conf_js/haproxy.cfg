# -----------------------
# GLOBAL CONFIGURATION
# -----------------------
global
    # Unix socket untuk stats dan management
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

    # Timeout panjang untuk CLI socket
    stats timeout 1d

    # Buffer besar untuk HTTP/2
    tune.h2.initial-window-size 2147483647

    # Parameter SSL
    tune.ssl.default-dh-param 2048

    # PID file
    pidfile /run/haproxy.pid

    # Chroot (direktori harus ada)
    chroot /var/lib/haproxy

    # User dan group (harus ada)
    user haproxy
    group haproxy

    # Daemon mode
    daemon

    # Logging ke systemd/journald (lebih baik di Ubuntu)
    log stdout format raw local0 info

    # SSL defaults
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

    # Base path untuk cert (opsional)
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private


# -----------------------
# DEFAULTS
# -----------------------
defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 200ms
    timeout client  300s
    timeout server  300s


# -----------------------
# FRONTENDS
# -----------------------

# Frontend untuk port range 222-1000
frontend multiport
    mode tcp
    bind-process 1 2
    bind *:222-1000 tfo
    tcp-request inspect-delay 500ms
    tcp-request content accept if HTTP
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend recir_http if HTTP 
    default_backend recir_https


# Frontend loopback untuk HTTP proxy
frontend multiports
    mode tcp
    bind abns@haproxy-http accept-proxy tfo
    default_backend recir_https_www


# Frontend utama: HTTP + HTTPS + SSL passthrough
frontend ssl
    mode tcp
    bind *:80 tfo
    bind *:55 tfo
    bind *:8080 tfo 
    bind *:8880 tfo
    bind *:2095 tfo
    bind *:2082 tfo
    bind *:2086 tfo
    bind abns@haproxy-https accept-proxy ssl crt /etc/haproxy/hap.pem alpn h2,http/1.1 tfo

    tcp-request inspect-delay 500ms
    tcp-request content capture req.ssl_sni len 100
    tcp-request content accept if { req.ssl_hello_type 1 }

    # ACL untuk deteksi WebSocket, SSH, dan HTTP/2
    acl chk-02_up hdr(Connection) -i upgrade
    acl chk-02_ws hdr(Upgrade) -i websocket
    acl this_payload payload(0,7) -m bin 5353482d322e30  # Deteksi SSH: "SSH-2.0"
    acl up-to ssl_fc_alpn -i h2                   # HTTP/2

    use_backend GRUP_FTVPN if up-to
    use_backend FTVPN if chk-02_up chk-02_ws 
    use_backend FTVPN if { path_reg -i ^\/(.*) }   # Path regex (hanya valid di mode http)
    use_backend BOT_FTVPN if this_payload
    default_backend CHANNEL_FTVPN


# -----------------------
# BACKENDS
# -----------------------

backend recir_https_www
    mode tcp
    server misssv-bau 127.0.0.1:2223 check

backend FTVPN
    mode http
    server hencet-bau 127.0.0.1:1010 send-proxy check 

backend GRUP_FTVPN
    mode tcp
    server hencet-baus 127.0.0.1:1013 send-proxy check

backend CHANNEL_FTVPN
    mode tcp
    balance roundrobin
    server nonok-bau 127.0.0.1:1194 check
    server memek-bau 127.0.0.1:1012 send-proxy check

backend BOT_FTVPN
    mode tcp
    server misv-bau 127.0.0.1:2222 check

backend recir_http
    mode tcp
    server loopback-http abns@haproxy-http send-proxy-v2 check

backend recir_https
    mode tcp
    server loopback-https abns@haproxy-https send-proxy-v2 check
# CFG LOADBALANCER WENDY VPN [ xxx ]
global
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 1d
    tune.h2.initial-window-size 2147483647
    tune.ssl.default-dh-param 2048
    pidfile /run/haproxy.pid
    user haproxy
    group haproxy
    daemon
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 200ms
    timeout client  300s
    timeout server  300s

frontend multiport
    mode tcp
    bind *:222-1000 tfo
    tcp-request inspect-delay 500ms
    tcp-request content accept if HTTP
    tcp-request content accept if { req.ssl_hello_type 1 }
    tcp-request content accept if { payload(0,7) -m bin 5353482d322e30 }
    acl multi_ssh payload(0,7) -m bin 5353482d322e30
    use_backend recir_http if HTTP
    use_backend recir_https if { req.ssl_hello_type 1 }
    use_backend dropbear_backend if multi_ssh
    default_backend dropbear_backend

frontend multiports
    mode tcp
    bind abns@haproxy-http accept-proxy tfo
    default_backend ws_backend

frontend ssl
    mode tcp
    bind *:80 tfo
    bind *:55 tfo
    bind *:8080 tfo
    bind *:8880 tfo
    bind *:2095 tfo
    bind *:2082 tfo
    bind *:2086 tfo
    bind *:2080 tfo
    bind abns@haproxy-https accept-proxy ssl crt /etc/haproxy/hap.pem alpn h2,http/1.1 tfo

    tcp-request inspect-delay 500ms
    tcp-request content capture req.ssl_sni len 100
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl chk-02_up hdr(Connection) -i upgrade
    acl chk-02_ws hdr(Upgrade) -i websocket
    acl this_payload payload(0,7) -m bin 5353482d322e30
    acl up-to ssl_fc_alpn -i h2

    use_backend grpc_backend if up-to
    use_backend ws_backend if chk-02_up chk-02_ws
    use_backend ws_backend if { path_reg -i ^\/(.*) }
    use_backend dropbear_backend if this_payload
    # OpenVPN dimatikan (perintah pemilik, 2026-10-22): default ke Dropbear,
    # ovpn_backend tetap didefinisikan di bawah untuk kompatibilitas, bukan default.
    default_backend dropbear_backend

backend recir_http
    mode tcp
    server loopback-http abns@haproxy-http send-proxy-v2 check

backend recir_https
    mode tcp
    server loopback-https abns@haproxy-https send-proxy-v2 check

backend ws_backend
    mode http
    # HAProxy DIPIN 2.0 oleh installer (lihat setup-main.sh): opsi http-tunnel
    # WAJIB ada di 2.0 agar payload SSH (DarkTunnel/HTTP Custom) diteruskan
    # ke Dropbear setelah jawaban HTTP. JANGAN pakai template ini dengan
    # HAProxy 2.1+ — di sana opsi ini fatal dan HAProxy tidak akan start.
    option http-tunnel
    timeout tunnel 1h
    server ws_server 127.0.0.1:1010 send-proxy

backend grpc_backend
    mode tcp
    server grpc_server 127.0.0.1:1013 send-proxy check

backend dropbear_backend
    mode tcp
    server dropbear_server 127.0.0.1:143 check

backend ovpn_backend
    mode tcp
    balance roundrobin
    server ovpn_direct 127.0.0.1:1194 check
    server ovpn_ws 127.0.0.1:1012 send-proxy check

name: Check VPS Expiry and Notify Telegram

on:
  schedule:
    - cron: '0 0 * * *'  # Setiap hari pukul 00:00 UTC
  workflow_dispatch:     # Bisa dijalankan manual

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run expiry checker
        run: |
          # Set environment
          export HOME=/root
          export TERM=xterm

          # Config
          REPO="https://raw.githubusercontent.com/bowowiwendi/ipvps/main/main/ip"
          KEY="6778508111:AAGmlVVILOA0z4kgLHoA1gD7Hf-maAi9vCQ"
          CHATID="5162695441"
          TIME="10"
          URL="https://api.telegram.org/bot$KEY/sendMessage"

          # Fungsi notif
          notif-exp() {
            local user="$1"
            local ip="$2"
            local exp="$3"
            local TEXT="<code>──────────────────────────────────</code>
<b>⚠️ YOUR VPS EXPIRED ⚠️</b>
<code>──────────────────────────────────</code>
USER        : $user
VPS IP      : $ip
DATE        : $exp
<code>──────────────────────────────────</code>"
            curl -s --max-time $TIME -d "chat_id=$CHATID&disable_web_page_preview=1&text=$TEXT&parse_mode=html" "$URL" > /dev/null
          }

          # Ambil data sekali
          raw_data=$(curl -sS "$REPO")

          # Ambil semua user yang bukan lifetime
          while IFS= read -r line; do
            if [[ "$line" =~ ^\#\#\# ]]; then
              # Split baris berdasarkan spasi
              read -r _ user exp ip <<< "$line"
              # Skip jika lifetime
              if [[ "$exp" == "lifetime" ]]; then
                continue
              fi
              # Hitung sisa hari
              now=$(date +%Y-%m-%d)
              d1=$(date -d "$exp" +%s 2>/dev/null)
              d2=$(date -d "$now" +%s)
              if [[ -n "$d1" ]]; then
                exp2=$(( (d1 - d2) / 86400 ))
                # Kirim notif jika <= 2 hari
                if [[ $exp2 -le 2 ]]; then
                  echo "⚠️ $user akan expire dalam $exp2 hari ($exp)"
                  notif-exp "$user" "$ip" "$exp"
                fi
              else
                echo "❌ Tanggal invalid: $exp untuk $user"
              fi
            fi
          done <<< "$raw_data"